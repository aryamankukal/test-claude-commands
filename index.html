<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Site</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 3rem;
      border: 1px solid #333;
      border-radius: 12px;
      max-width: 480px;
    }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    p { color: #aaa; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 1rem;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 999px;
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello World</h1>
    <p>A minimal demo site committed on a new branch.</p>
    <span class="badge">feature/demo-website</span>
  </div>
</body>
</html>
